name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'desktop_entry.py'
      - 'pyproject.toml'
      - 'build-exe.ps1'
      - 'quantbot_v096.spec'
      - 'version_info.txt'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install --index-url https://pypi.org/simple ".[dev]"
      - name: Test changed behavior without exchange connections
        shell: python
        run: |
          import socket
          import pytest
          def blocked(*args, **kwargs):
              raise RuntimeError("Network blocked during offline tests")
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          socket.create_connection = blocked
          socket.getaddrinfo = blocked
          raise SystemExit(pytest.main([
              "-q", "tests/test_account05_signals.py", "tests/test_account05_state.py",
              "tests/test_account05_review_view.py", "tests/test_manual_order_review.py",
              "tests/test_live_aggressive_adapter.py", "tests/test_extreme_profit_sweep.py"
          ]))
      - name: Build EXE without launching it
        shell: pwsh
        run: |
          ./build-exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          $exe = Get-ChildItem dist/CodexQuantBot-v*-Slots-Base-Switch.exe
          if (@($exe).Count -ne 1) { throw "Expected exactly one EXE" }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($exe.Name)" | Set-Content dist/SHA256SUMS.txt
      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from quantbot.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot read application version" }
          $exe = Get-Item "dist/CodexQuantBot-v$version-Slots-Base-Switch.exe"
          gh release create "v$version" $exe.FullName dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "CodexQuantBot v$version" --notes "Windows EXE with SHA-256 checksum. Built after offline account05 tests. Application not launched; no exchange or trading operations performed. Extreme reversal waits for all qualifying manual and automatic addon exits to be confirmed. Base rules preserved. Known manual exits use ledger links; others remain FIFO inference."
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
